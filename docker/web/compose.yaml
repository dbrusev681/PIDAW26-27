services:
  # Define el servicio web
  webserver:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.webserver
    container_name: webserver
    depends_on:
      db: # Depende de la base de datos para iniciar
        condition: service_healthy
    volumes:
      - ./app:/var/www/html
      - ../certbot/certs:/etc/letsencrypt:ro          # Certificados en solo lectura
      - laravel_storage:/var/www/html/storage         # Volumenes independientes para el almacenamiento de laravel
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web_network
    command: > # Ejecuta las migraciones y se levanta el demonio de Apache
      sh -c "
        php artisan migrate &&
        apachectl -D FOREGROUND
      "
    restart: unless-stopped

  # Define el servicio de Frontend (Node.js + Vite)
  frontend:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.node
    container_name: frontend_vite
    volumes:
      - ./app:/var/www/html
    ports:
      - "5173:5173" # Puerto nativo de Vite
    networks:
      - web_network
    restart: always
    command: sh -c "npm install && npm run build && tail -f /dev/null"

  # Define el servicio de PostgreSQL
  db:
    image: postgres
    container_name: database
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck: # Se considera que ha iniciado correctamente si inicia sesion.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql
    networks:
      - web_network
    restart: unless-stopped

  # Define el servicio de Dbeaver
  cloudbeaver:
      image: dbeaver/cloudbeaver
      container_name: dbeaver
      ports:
        - 8082:8978
      volumes:
        - dbeaver_data:/opt/cloudbeaver/workspace
      networks:
        - web_network
      restart: unless-stopped

volumes:
  laravel_storage:
  database_data:
  dbeaver_data:

networks:
  web_network:
    driver: bridge
