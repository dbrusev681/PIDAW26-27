<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	ServerName www.tallerdigial.freeddns.org
	ServerAlias tallerdigial.freeddns.org
	DocumentRoot /var/www/html/
	
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	SSLEngine on

	SSLCertificateFile /etc/letsencrypt/live/tallerdigital.freeddns.org/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/tallerdigital.freeddns.org/privkey.pem
	
	<FilesMatch "\.(?:cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
	<Directory /usr/lib/cgi-bin>
		SSLOptions +StdEnvVars
	</Directory>
</VirtualHost>

<VirtualHost *:80>
	ServerName www.tallerdigital.freeddns.org
	ServerAlias tallerdigital.freeddns.org
	Redirect permanent / https://www.tallerdigital.freeddns.org
</VirtualHost>