services:
  certbot:
    build: .
    container_name: certbot
    restart: unless-stopped

    environment:
      - EMAIL
      - DOMAIN
      - ALTDOMAIN
      - GRUPO

    volumes:
      - ./certs:/etc/letsencrypt
      - ./dynu-credentials.ini:/root/dynu-credentials.ini:ro

    networks:
      - web_network

networks:
  web_network:
    driver: bridge